<!DOCTYPE html>
<html lang="en" data-theme="default" data-kind="home">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viewer</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body class="landing">
    <div class="landing-bg" aria-hidden="true">
      <div class="landing-bg-grid"></div>
      <span class="landing-orb landing-orb-key"></span>
      <span class="landing-orb landing-orb-str"></span>
      <span class="landing-orb landing-orb-num"></span>
      <span class="landing-orb landing-orb-bool"></span>
      <div class="landing-tokens" aria-hidden="true"></div>
      <div class="landing-bg-vignette"></div>
    </div>

    <svg class="glyphs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" width="0" height="0">
      <symbol id="g-upload" viewBox="0 0 16 16">
        <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 10V3.5M5 6.2 8 3.2l3 3" />
          <path d="M3 9.8v2.4a1.3 1.3 0 0 0 1.3 1.3h7.4A1.3 1.3 0 0 0 13 12.2V9.8" />
        </g>
      </symbol>
      <symbol id="g-sun" viewBox="0 0 16 16">
        <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="2.3" />
          <path d="M8 2.4v1.6M8 12v1.6M2.4 8h1.6M12 8h1.6M4.1 4.1l1.1 1.1M10.8 10.8l1.1 1.1M4.1 11.9l1.1-1.1M10.8 5.2l1.1-1.1" />
        </g>
      </symbol>
      <symbol id="g-swatch" viewBox="0 0 16 16">
        <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="5" />
          <path d="M8 3a5 5 0 0 0 0 10z" fill="currentColor" stroke="none" />
        </g>
      </symbol>
      <symbol id="g-moon" viewBox="0 0 16 16">
        <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.1 3.1a5.2 5.2 0 1 0 2.7 9.2 4.15 4.15 0 0 1-2.7-9.2z" />
        </g>
      </symbol>
      <symbol id="g-github" viewBox="0 0 16 16">
        <path
          fill="currentColor"
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
        />
      </symbol>
    </svg>

    <main class="landing-card">
      <header class="brand">
        <div class="brand-head">
          <h1>Viewer</h1>
          <a class="landing-source" href="https://github.com/jclerc/viewer" target="_blank" rel="noopener noreferrer">
            <svg class="glyph" aria-hidden="true" viewBox="0 0 16 16" width="16" height="16"><use href="#g-github" /></svg>
            Source
          </a>
        </div>
        <p>
          Paste JSON, Markdown, CSV, Python, JavaScript, or SQL, or upload a file. We'll open the matching
          viewer.
        </p>
      </header>

      <div class="source-wrap">
        <textarea
          id="source"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          placeholder='{"hello": "world"}'
          aria-label="Document to open"
        ></textarea>
      </div>

      <p id="kind-hint" class="kind-hint"></p>
      <p id="status" class="status" hidden></p>

      <div class="actions">
        <button type="button" id="open-btn" class="primary">Open</button>
        <button type="button" id="upload-btn">
          <svg class="glyph" aria-hidden="true" viewBox="0 0 16 16" width="16" height="16"><use href="#g-upload" /></svg>
          Upload file
        </button>
      </div>

      <nav class="landing-links">
        <a href="./json/">JSON</a>
        <a href="./md/">Markdown</a>
        <a href="./csv/">CSV</a>
        <a href="./py/">Python</a>
        <a href="./js/">JavaScript</a>
        <a href="./sql/">SQL</a>
      </nav>

      <div class="theme-row" role="radiogroup" aria-label="Theme">
        <button type="button" data-theme="light" aria-pressed="false">
          <svg class="glyph" aria-hidden="true" viewBox="0 0 16 16" width="16" height="16"><use href="#g-sun" /></svg>
          Light
        </button>
        <button type="button" data-theme="default" aria-pressed="true">
          <svg class="glyph" aria-hidden="true" viewBox="0 0 16 16" width="16" height="16"><use href="#g-swatch" /></svg>
          Default
        </button>
        <button type="button" data-theme="dark" aria-pressed="false">
          <svg class="glyph" aria-hidden="true" viewBox="0 0 16 16" width="16" height="16"><use href="#g-moon" /></svg>
          Dark
        </button>
      </div>
    </main>

    <input
      id="file"
      type="file"
      hidden
      accept=".json,.jsonl,.jsonc,.md,.markdown,.csv,.tsv,.txt,.py,.pyi,.js,.mjs,.cjs,.jsx,.sql,application/json,text/markdown,text/csv,text/plain,text/x-python,text/javascript,application/javascript,application/sql"
    />

    <script type="module" src="./assets/home.js"></script>
  </body>
</html>
